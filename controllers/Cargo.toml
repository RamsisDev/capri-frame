[package]
name = "capri-ctl"
version.workspace = true
edition.workspace = true
description = "Controladores de prueba: mandan streams al cuerpo para verificación visual"
default-run = "capri-ctl"

[[bin]]
name = "capri-eyes"
path = "src/visual/main.rs"
required-features = ["visual"]

[features]
# Panel nativo; incluye el micrófono de prueba (cpal) para mover la boca con la voz.
visual = ["dep:eframe", "dep:cpal"]

[dependencies]
capri-protocol.workspace = true
serde_json.workspace = true
tungstenite.workspace = true
eframe = { version = "0.37", optional = true, default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
cpal = { version = "0.18.2", optional = true }

[dev-dependencies]
capri-core.workspace = true
