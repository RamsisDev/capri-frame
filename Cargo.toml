[workspace]
resolver = "3"
members = ["crates/*", "controllers"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
capri-protocol = { path = "crates/capri-protocol" }
capri-link     = { path = "crates/capri-link" }
capri-core     = { path = "crates/capri-core" }
capri-render   = { path = "crates/capri-render" }

serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
tungstenite = "0.30"
wgpu        = "30"
winit       = "0.30"
pollster    = "1"
bytemuck    = { version = "1", features = ["derive"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
